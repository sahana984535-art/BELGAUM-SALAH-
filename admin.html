
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Imam Approval Admin | Belgaum Salah</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#f3f7f4;color:#18362e;font-family:Arial,sans-serif}
header{background:#043d32;color:white;padding:20px}
main{max-width:1000px;margin:25px auto;padding:16px}
.card,.request{background:white;border:1px solid #dce8e0;border-radius:14px;padding:20px;margin:14px 0}
input,select{font:inherit;padding:12px;border:1px solid #ccdcd1;border-radius:8px;width:100%;box-sizing:border-box;margin:7px 0 12px}
button{padding:12px 15px;border:0;border-radius:8px;background:#075b49;color:white;font-weight:bold;cursor:pointer;margin:5px 5px 5px 0}
.secondary{background:#e8f1eb;color:#075b49}
.danger{background:#a52b25}
.muted{color:#687d74;white-space:pre-wrap;line-height:1.6}
.status{background:#fff7e5;padding:12px;border-radius:8px;white-space:pre-wrap}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <h2>🕌 Belgaum Salah — Admin Approvals</h2>
</header>

<main>
<section id="login" class="card">
  <h2>Admin Sign In</h2>
  <p class="muted">Use your existing approved administrator account.</p>
  <form id="loginForm">
    <label>Email</label>
    <input id="email" type="email" required>
    <label>Password</label>
    <input id="password" type="password" required>
    <button type="submit">Sign In</button>
  </form>
  <p id="loginStatus" class="status hidden"></p>
</section>

<section id="panel" class="hidden">
  <div class="card">
    <h2>Pending Imam Applications</h2>
    <p class="muted">This page checks for requests every 20 seconds while open.</p>
    <div id="status" class="status">Loading...</div>
    <button id="refresh" type="button">Refresh Requests</button>
    <button id="logout" class="secondary" type="button">Sign Out</button>
  </div>
  <div id="requests"></div>
</section>
</main>

<script>
const SUPABASE_URL='https://ziewfvsoktvawskimwqb.supabase.co';
const SUPABASE_KEY='sb_publishable_pM2LZYu9qZmHfAJE2OSf1Q_-PTtzuHu';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let timer=null;

$('loginForm').addEventListener('submit',async event=>{
  event.preventDefault();
  $('loginStatus').classList.add('hidden');

  try{
    const {data,error}=await db.auth.signInWithPassword({
      email:$('email').value.trim(),
      password:$('password').value
    });
    if(error) throw error;

    const {data:profile,error:profileError}=await db
      .from('profiles')
      .select('role,approved')
      .eq('id',data.user.id)
      .maybeSingle();

    if(profileError) throw profileError;

    if(profile?.role!=='admin'||profile?.approved!==true){
      await db.auth.signOut();
      throw new Error('This account is not an approved admin.');
    }

    $('login').classList.add('hidden');
    $('panel').classList.remove('hidden');
    await loadRequests();
    timer=setInterval(loadRequests,20000);
  }catch(error){
    $('loginStatus').textContent=error.message;
    $('loginStatus').classList.remove('hidden');
  }
});

async function loadRequests(){
  $('status').textContent='Loading requests...';

  try{
    const {data:requests,error}=await db
      .from('imam_signup_requests')
      .select('*')
      .eq('status','pending')
      .order('created_at',{ascending:true});
    if(error) throw error;

    const {data:masjids,error:masjidError}=await db
      .from('Masjids')
      .select('id,name,area,address,imam_id')
      .order('name');
    if(masjidError) throw masjidError;

    $('requests').replaceChildren();
    $('status').textContent=requests.length
      ?requests.length+' pending application(s).'
      :'No pending applications.';

    for(const r of requests){
      const card=document.createElement('article');
      card.className='request';

      const title=document.createElement('h3');
      title.textContent=r.imam_name+' — '+r.masjid_name;

      const details=document.createElement('p');
      details.className='muted';
      details.textContent=
        'Phone: '+r.phone+
        '\nEmail: '+(r.email||'Not available')+
        '\nArea: '+r.area+
        '\nAddress: '+r.address+
        '\nSubmitted: '+new Date(r.created_at).toLocaleString('en-IN');

      const select=document.createElement('select');
      const first=document.createElement('option');
      first.value='';
      first.textContent='Select masjid to assign...';
      select.append(first);

      for(const m of masjids){
        const option=document.createElement('option');
        option.value=m.id;
        option.textContent=m.name+' — '+(m.area||'')+
          (m.imam_id?' (already assigned)':'');
        if(m.imam_id) option.disabled=true;
        select.append(option);
      }

      const approve=document.createElement('button');
      approve.textContent='Approve & Assign Masjid';
      approve.onclick=async()=>{
        if(!select.value){
          alert('Please select an available masjid.');
          return;
        }
        if(!confirm('Approve this Imam and assign the selected masjid?'))return;
        approve.disabled=true;

        try{
          const {error}=await db.rpc('admin_approve_imam_request',{
            p_request_id:r.id,
            p_masjid_id:select.value
          });
          if(error) throw error;
          alert('Imam approved and masjid assigned.');
          await loadRequests();
        }catch(error){
          alert('Approval failed: '+error.message);
        }finally{
          approve.disabled=false;
        }
      };

      const reject=document.createElement('button');
      reject.textContent='Reject Application';
      reject.className='danger';
      reject.onclick=async()=>{
        const note=prompt('Reason (optional):')||'';
        if(!confirm('Reject this application?'))return;
        try{
          const {error}=await db.rpc('admin_reject_imam_request',{
            p_request_id:r.id,
            p_note:note
          });
          if(error) throw error;
          await loadRequests();
        }catch(error){
          alert('Reject failed: '+error.message);
        }
      };

      card.append(title,details,select,approve,reject);
      $('requests').append(card);
    }
  }catch(error){
    $('status').textContent=
      'Could not load applications: '+error.message+
      '\nCheck SQL setup, table permissions and admin role.';
  }
}

$('refresh').onclick=loadRequests;
$('logout').onclick=async()=>{
  if(timer)clearInterval(timer);
  await db.auth.signOut();
  location.reload();
};
</script>
</body>
</html>
