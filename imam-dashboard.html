
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Imam Dashboard | Belgaum Salah</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#f3f7f4;color:#18352b;font-family:Arial,sans-serif}
header{background:#043b2e;color:white;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
main{max-width:950px;margin:25px auto;padding:16px}
.card{background:white;border:1px solid #dce7df;border-radius:14px;padding:22px;margin-bottom:18px}
input{padding:12px;border:1px solid #ccdcd1;border-radius:8px;width:100%;box-sizing:border-box;font:inherit}
label{font-weight:bold;font-size:13px}
.field{display:flex;flex-direction:column;gap:7px;margin:14px 0}
button{padding:12px 16px;border:0;border-radius:8px;background:#064e3b;color:white;font-weight:bold;cursor:pointer;margin:5px 5px 5px 0}
.secondary{background:#e8f1eb;color:#064e3b}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prayer{border:1px solid #dce7df;border-radius:12px;padding:16px;margin:12px 0}
.muted{color:#6b7e75;line-height:1.5}
.status{padding:12px;border-radius:8px;margin:12px 0;white-space:pre-wrap}
.error{background:#fff0ef;color:#b42318}
.success{background:#e9f8ef;color:#086342}
.hidden{display:none!important}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div><h2>🕌 Belgaum Salah</h2>IMAM DASHBOARD</div>
  <button id="logoutBtn" class="secondary hidden" type="button">Sign Out</button>
</header>

<main>
<section id="loginCard" class="card">
  <h2>Imam Sign In</h2>
  <p class="muted">Only approved Imam accounts can access this dashboard.</p>
  <p id="loginStatus" class="status hidden"></p>
  <form id="loginForm">
    <div class="field">
      <label>Email</label>
      <input id="email" type="email" required>
    </div>
    <div class="field">
      <label>Password</label>
      <input id="password" type="password" required>
    </div>
    <button id="loginBtn" type="submit">Sign In</button>
  </form>
  <p><a href="./imam.html">New Imam? Register here</a></p>
</section>

<section id="dashboard" class="hidden">
  <div class="card">
    <h2 id="masjidName">Loading Masjid...</h2>
    <p id="masjidAddress" class="muted"></p>
    <p id="masjidArea" class="muted"></p>
    <p id="pageStatus" class="status hidden"></p>
  </div>

  <div class="card">
    <h2>Prayer Timings</h2>
    <p class="muted">Enter azaan and jamaat times, then save.</p>
    <form id="timingForm">
      <div id="prayerFields"></div>
      <button id="saveBtn" type="submit">Save Timings</button>
      <button id="reloadBtn" class="secondary" type="button">Reload Timings</button>
    </form>
  </div>
</section>

<section id="noAssignment" class="card hidden">
  <h2>No Masjid Assigned</h2>
  <p>Please contact the administrator to assign your masjid.</p>
</section>
</main>

<script>
const SUPABASE_URL='https://ziewfvsoktvawskimwqb.supabase.co';
const SUPABASE_KEY='sb_publishable_pM2LZYu9qZmHfAJE2OSf1Q_-PTtzuHu';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);

const prayers=[
  {key:'fajr',label:'Fajr'},
  {key:'zuhr',label:'Zuhr'},
  {key:'asr',label:'Asr'},
  {key:'maghrib',label:'Maghrib'},
  {key:'isha',label:'Isha'}
];

let currentUser=null;
let assignedMasjid=null;

function status(id,message,type='error'){
  const el=$(id);
  el.textContent=message;
  el.className='status '+type;
}
function hideStatus(id){
  $(id).textContent='';
  $(id).className='status hidden';
}
function showLogin(message=''){
  $('loginCard').classList.remove('hidden');
  $('dashboard').classList.add('hidden');
  $('noAssignment').classList.add('hidden');
  $('logoutBtn').classList.add('hidden');
  if(message)status('loginStatus',message);
}
function showDashboard(){
  $('loginCard').classList.add('hidden');
  $('dashboard').classList.remove('hidden');
  $('noAssignment').classList.add('hidden');
  $('logoutBtn').classList.remove('hidden');
}

function timeValue(value){
  if(!value)return '';
  const match=String(value).match(/^(\d{1,2}):(\d{2})/);
  return match?match[1].padStart(2,'0')+':'+match[2]:'';
}

function renderFields(row){
  $('prayerFields').replaceChildren();

  for(const prayer of prayers){
    const section=document.createElement('div');
    section.className='prayer';

    const heading=document.createElement('h3');
    heading.textContent=prayer.label;
    section.append(heading);

    const grid=document.createElement('div');
    grid.className='grid';

    for(const type of ['azaan','jamaat']){
      const key=prayer.key+'_'+type;
      const field=document.createElement('div');
      field.className='field';

      const label=document.createElement('label');
      label.textContent=prayer.label+' '+type;
      label.htmlFor=key;

      const input=document.createElement('input');
      input.type='time';
      input.id=key;
      input.required=true;
      input.value=timeValue(row[key]);

      field.append(label,input);
      grid.append(field);
    }
    section.append(grid);
    $('prayerFields').append(section);
  }
}

async function loadAssignedMasjid(){
  const {data,error}=await db.from('Masjids')
    .select('id,name,area,address,imam_id,fajr_azaan,fajr_jamaat,zuhr_azaan,zuhr_jamaat,asr_azaan,asr_jamaat,maghrib_azaan,maghrib_jamaat,isha_azaan,isha_jamaat')
    .eq('imam_id',currentUser.id);

  if(error)throw error;

  if(!data||data.length===0){
    assignedMasjid=null;
    $('dashboard').classList.add('hidden');
    $('noAssignment').classList.remove('hidden');
    return;
  }

  if(data.length!==1){
    throw new Error('Your account has multiple masjid assignments. Contact admin.');
  }

  assignedMasjid=data[0];
  $('masjidName').textContent=assignedMasjid.name||'Masjid';
  $('masjidAddress').textContent=assignedMasjid.address||'';
  $('masjidArea').textContent=assignedMasjid.area?'Area: '+assignedMasjid.area:'';
  renderFields(assignedMasjid);
}

async function checkAccess(user){
  currentUser=user;

  const {data:profile,error}=await db.from('profiles')
    .select('id,role,approved')
    .eq('id',user.id)
    .maybeSingle();

  if(error)throw error;

  if(!profile||profile.role!=='imam'||profile.approved!==true){
    await db.auth.signOut();
    currentUser=null;
    showLogin('Access denied. Your Imam account is not approved yet.');
    return;
  }

  showDashboard();
  await loadAssignedMasjid();
}

$('loginForm').addEventListener('submit',async event=>{
  event.preventDefault();
  hideStatus('loginStatus');
  $('loginBtn').disabled=true;

  try{
    const {data,error}=await db.auth.signInWithPassword({
      email:$('email').value.trim(),
      password:$('password').value
    });
    if(error)throw error;
    await checkAccess(data.user);
  }catch(error){
    showLogin(error.message);
  }finally{
    $('loginBtn').disabled=false;
  }
});

$('timingForm').addEventListener('submit',async event=>{
  event.preventDefault();
  hideStatus('pageStatus');

  if(!currentUser||!assignedMasjid){
    status('pageStatus','No assigned masjid found.');
    return;
  }

  $('saveBtn').disabled=true;

  try{
    const updates={};

    for(const prayer of prayers){
      for(const type of ['azaan','jamaat']){
        const key=prayer.key+'_'+type;
        const value=$(key).value;
        if(!value)throw new Error('Enter every azaan and jamaat time.');
        updates[key]=value;
      }
    }

    const {data,error}=await db.from('Masjids')
      .update(updates)
      .eq('id',assignedMasjid.id)
      .eq('imam_id',currentUser.id)
      .select('id');

    if(error)throw error;
    if(!data||data.length!==1){
      throw new Error('No row updated. Check your masjid assignment and database policies.');
    }

    status('pageStatus','Prayer timings saved successfully.','success');
    await loadAssignedMasjid();
  }catch(error){
    status('pageStatus',error.message);
  }finally{
    $('saveBtn').disabled=false;
  }
});

$('reloadBtn').onclick=async()=>{
  try{
    await loadAssignedMasjid();
    status('pageStatus','Timings reloaded.','success');
  }catch(error){
    status('pageStatus',error.message);
  }
};

$('logoutBtn').onclick=async()=>{
  await db.auth.signOut();
  currentUser=null;
  assignedMasjid=null;
  showLogin();
};

(async()=>{
  try{
    const {data,error}=await db.auth.getSession();
    if(error)throw error;
    if(data.session)await checkAccess(data.session.user);
    else showLogin();
  }catch(error){
    showLogin(error.message);
  }
})();
</script>
</body>
</html>
